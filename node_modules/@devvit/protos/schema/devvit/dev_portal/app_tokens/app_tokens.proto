syntax = "proto3";

package devvit.dev_portal.app_tokens;

import "google/protobuf/timestamp.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/apptokens";

message AppToken {
  // Token UUID from the External Endpoints AppTokenBase table.
  string id = 1;
  // Unique user-provided token identifier conforming to `[a-zA-Z0-9_-]+`. Eg,
  // `game-api-token`.
  string name = 2;
  // Secret token value. Only returned immediately after token creation; list responses omit it.
  optional string token = 3;
  // Creation timestamp. JSON encoding example: `2026-06-23T12:34:56Z`.
  google.protobuf.Timestamp created_at = 4;
  string created_by_t2 = 5;
}

message ListAppTokensRequest {
  string app_slug = 1;
}

message ListAppTokensResponse {
  repeated AppToken tokens = 1;
}

message CreateAppTokenRequest {
  string app_slug = 1;
  string token_name = 2;
}

message CreateAppTokenResponse {
  AppToken token = 1;
}

message DeleteAppTokenRequest {
  string app_slug = 1;
  string token_id = 2;
}
