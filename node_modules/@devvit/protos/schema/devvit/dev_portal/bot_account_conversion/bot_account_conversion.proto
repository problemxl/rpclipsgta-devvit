syntax = "proto3";

package devvit.dev_portal.bot_account_conversion;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/botaccountconversion";

// Response returned after a bot account has successfully taken over a Devvit app.
message BotAccountConversionResponse {
  // The UUID of the migrated Devvit app. (Same as what was passed in.)
  string app_id = 1;
  // The app slug before the migration. (i.e., old-app-slug)
  string previous_app_slug = 2;
  // The app slug after the migration. This should match the username of the bot account that was converted. (i.e., my-cool-bot)
  string new_app_slug = 3;
}

// Request used to re-attempt a partially complete bot -> app account conversion
message ResumeBotAccountConversionRequest {
  // The UUID of the account conversion request to re-attempt
  string conversion_uuid = 1;
}

// Used to create a new bot -> app account conversion
message CreateBotAccountConversionRequest {
  // The UUID of the Devvit app whose app account should be replaced.
  string app_id = 1;
  // The t2_ ID of the Reddit bot account that should become the app account. (i.e., t2_a1b2c3)
  string bot_account_id = 2;
}

// The status of a bot -> app account conversion request
enum BotAccountConversionRequestStatus {
  // This request is awaiting the developer confirming the password for the bot account
  BOT_ACCOUNT_CONVERSION_REQUEST_AWAITING_BOT_PASSWORD = 0;
  // This request has converted the bot account to an app account, but is not fully migrated. Admins can re-attempt this via the admin UI at this point.
  BOT_ACCOUNT_CONVERSION_REQUEST_MIGRATION_PARTIALLY_COMPLETE = 1;
  // This request has been fully completed.
  BOT_ACCOUNT_CONVERSION_REQUEST_COMPLETE = 2;
}

// Info about an bot -> app account conversion request
message BotAccountConversionInfo {
  // The UUID of the account conversion request
  string conversion_uuid = 1;
  // The status of the conversion request
  BotAccountConversionRequestStatus status = 2;
  // The URL the developer should use to complete the conversion process (e.x. "https://developers.reddit.com/app-migration/{uuid}")
  string developer_finalization_url = 3;
}

// Request to get the bot account conversion info for an app, if a request is already in progress
message GetBotAccountConversionInProgressRequest {
  // The UUID of the Devvit app we're inquiring about
  string app_id = 1;
}

// Info about an app's bot account conversion progress, if there's one in progress currently
message GetBotAccountConversionInProgressResponse {
  // The account conversion request info requested, if one exists; no value if none exists
  optional BotAccountConversionInfo info = 1;
}

// Confirms a bot -> app account conversion that was already started by an admin.
message ConfirmBotAccountConversionRequest {
  // The UUID of the account conversion request
  string conversion_uuid = 1;
  // The password of the Reddit bot account that should become the app account. (i.e., correct-horse-battery-staple)
  string bot_account_password = 3;
}
