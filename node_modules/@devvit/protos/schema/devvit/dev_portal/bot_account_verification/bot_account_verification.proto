syntax = "proto3";

package devvit.dev_portal.bot_account_verification;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/botaccountverification";

// The metadata that accompanies a DevvitBotAccountVerificationToken, which is created and consumed through the one-time-code auth service
message BotAccountVerificationTokenMetadata {
  // The username of the automated account for which ownership is being verified by the OTC token
  string automation_account_username = 1;
  // The human verification case id
  string case_id = 2;
  // The human verification correlation id
  string hv_correlation_id = 3;
  // The username of the account which is registering the automated account
  string owner_account_username = 4;
}
