syntax = "proto3";

package devvit.dev_portal.asset_review;

import "buf/validate/validate.proto";
import "devvit/dev_portal/app/app.proto";
import "devvit/dev_portal/promotional_assets/promotional_assets.proto";
import "devvit/dev_portal/reddit/redditor.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/assetreview";

// GetPendingRequestsCountRequest is a request to retrieve the total count of PENDING AssetChangeRequests.
message GetPendingRequestsCountRequest {}

// GetPendingRequestsCountResponse is the response to a request to retrieve the total count of PENDING AssetChangeRequests.
message GetPendingRequestsCountResponse {
  // The total count of PENDING AssetChangeRequests.
  int32 count = 1;
}

// GetAssetReviewItemsByStatusRequest is a request to retrieve a page of AssetReviewItems by status.
message GetAssetReviewItemsByStatusRequest {
  // The status of the asset change requests to retrieve. If callers send an UNSPECIFIED status, the server will return all statuses.
  AssetReviewItemStatus status = 1;
  // How many pending requests to return in a single page. Defaults to 10 if not specified.
  optional int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 50
  }];
  // The page number of pending requests to return. The page number should start at 1. Defaults to 1 if not specified.
  optional int32 page_number = 3 [(buf.validate.field).int32.gte = 1];
  // The order by which to sort the asset review items (by createdAt timestamp). Defaults to newest items first.
  optional AssetReviewItemSortOrder sort_order = 4;
}

// AssetReviewItemStatus indicates the status of an AssetReviewItem. Used to filter the list of asset review items.
enum AssetReviewItemStatus {
  ASSET_REVIEW_ITEM_STATUS_UNSPECIFIED = 0;
  ASSET_REVIEW_ITEM_STATUS_PENDING = 1;
  ASSET_REVIEW_ITEM_STATUS_APPROVED = 2;
  ASSET_REVIEW_ITEM_STATUS_DENIED = 3;
  ASSET_REVIEW_ITEM_STATUS_OBSOLETE = 4;
}

// AssetReviewItemSortOrder represents the order by which to sort asset review items in the queue (by createdAt timestamp).
enum AssetReviewItemSortOrder {
  ASSET_REVIEW_ITEM_SORT_ORDER_UNSPECIFIED = 0;
  ASSET_REVIEW_ITEM_SORT_ORDER_NEWEST = 1;
  ASSET_REVIEW_ITEM_SORT_ORDER_OLDEST = 2;
}

// GetAssetReviewItemsByStatusResponse is the response to a request to retrieve a page of AssetChangeRequests by status.
message GetAssetReviewItemsByStatusResponse {
  // The list of asset review items with review details that match the request criteria.
  repeated AssetReviewItem asset_review_items = 1;
  // Indicates whether or not there is a next page of asset change requests.
  optional bool has_next_page = 2;
}

// AssetReviewItem contains an AssetChangeRequest and any persisted review details.
message AssetReviewItem {
  // The asset change request.
  promotional_assets.AssetChangeRequest asset_change_request = 1;
  // Persisted review details for the asset change request.
  repeated AssetChangeRequestReview reviews = 2;
  // The app associated with the asset change request, including currently approved promotional assets.
  app.AppWithApprovedPromotionalAssets app = 3;
}

// AssetChangeRequestReview contains persisted review details for an AssetChangeRequest.
message AssetChangeRequestReview {
  // The ID of the review decision. This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  string id = 1 [(buf.validate.field).string.uuid = true];
  // When the review decision was created.
  google.protobuf.Timestamp created_at = 2;
  // When the review decision was last updated.
  google.protobuf.Timestamp updated_at = 3;
  // The reviewer who submitted the decision.
  devvit.dev_portal.reddit.Redditor reviewer = 4;
  // The submitted review decision.
  AssetChangeRequestReviewDecision decision = 5;
  // Comment that accompanied the review decision, if applicable.
  optional string comment = 6;
  // The fields that were rejected during the review, if applicable.
  repeated AssetChangeRequestRejectedField rejected_fields = 7;
}

// SubmitReviewDecisionRequest is a request to submit a review decision for an AssetChangeRequest.
message SubmitReviewDecisionRequest {
  // The ID of the asset change request that we're submitting a review decision for. This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  string id = 1 [(buf.validate.field).string.uuid = true];
  // The review decision to submit.
  oneof decision {
    option (buf.validate.oneof).required = true;

    // Approve the asset change request.
    ApproveReviewDecision approve = 2;
    // Deny the asset change request.
    DenyReviewDecision deny = 3;
    // Mark the asset change request obsolete.
    ObsoleteReviewDecision obsolete = 4;
  }
}

// SubmitReviewDecisionResponse is the response to a request to submit a review decision for an AssetChangeRequest.
message SubmitReviewDecisionResponse {}

// ApproveReviewDecision approves an AssetChangeRequest.
message ApproveReviewDecision {}

// DenyReviewDecision denies an AssetChangeRequest.
message DenyReviewDecision {
  // Comment to accompany the denial, if applicable.
  optional string comment = 1;
  // The fields that were rejected during the review.
  repeated AssetChangeRequestRejectedField rejected_fields = 2;
}

// ObsoleteReviewDecision marks an AssetChangeRequest obsolete.
message ObsoleteReviewDecision {}

// AssetChangeRequestReviewDecision indicates the review decision made on an AssetChangeRequest.
enum AssetChangeRequestReviewDecision {
  ASSET_CHANGE_REQUEST_REVIEW_DECISION_UNSPECIFIED = 0;
  ASSET_CHANGE_REQUEST_REVIEW_DECISION_APPROVED = 1;
  ASSET_CHANGE_REQUEST_REVIEW_DECISION_DENIED = 2;
  ASSET_CHANGE_REQUEST_REVIEW_DECISION_OBSOLETE = 3;
}

// AssetChangeRequestRejectedField indicates a field that was rejected during the review of an AssetChangeRequest.
// The values here should be kept in sync with the fields on PromotionalAssetsInfo in promotional_assets.proto
enum AssetChangeRequestRejectedField {
  UNSPECIFIED_REJECTED_FIELD = 0;
  GAME_ICON = 1;
  FEATURING_ASSET = 2;
  FEATURING_DESCRIPTION = 3;
  FALLBACK_ASSET = 4;
  TILE_IMAGE = 5;
  TILE_TAGLINE = 6;
  GAME_CATEGORIES = 7;
  GAME_SUBREDDIT = 8;
  FLAIRS = 9;
  SORT_BY = 10;
}
