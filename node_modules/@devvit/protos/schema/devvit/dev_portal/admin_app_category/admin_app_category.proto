syntax = "proto3";

package devvit.dev_portal.admin_app_category;

import "buf/validate/validate.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/adminappcategory";

// Game subcategory details for the admin games category page.
message GameCategory {
  // ID of the category row.
  int32 id = 1;
  // Human-readable category name.
  string name = 2;
  // ID of the parent category.
  optional int32 parent_id = 3;
  // Optional category display rank. Lower rank = higher priority.
  optional int32 rank = 4;
  // Ordered app slugs that should be displayed first for this category in the admin UI.
  repeated string top_app_slugs_override = 5;
}

// Response containing game subcategories managed by the admin games category page.
message ListGameCategoriesResponse {
  // App categories under the GAME root category, ordered by rank.
  repeated GameCategory categories = 1;
}

// Desired display rank for a game subcategory.
message GameCategoryRankUpdate {
  // The category ID to update.
  int32 category_id = 1;
  // The new 1-indexed rank for the category.
  int32 rank = 2 [(buf.validate.field).int32.gt = 0];
}

// Request to update the display ranks for all game subcategories.
message UpdateGameCategoryRankRequest {
  // Complete desired rank ordering for game subcategories.
  repeated GameCategoryRankUpdate ranks = 1 [(buf.validate.field).repeated.min_items = 1];
}

// Response after updating a game subcategory rank.
message UpdateGameCategoryRankResponse {
  // Updated categories, ordered by rank.
  repeated GameCategory categories = 1;
}

// Request to update the top apps override for a game subcategory.
message UpdateGameCategoryTopAppsOverrideRequest {
  // The category ID to update.
  int32 category_id = 1;
  // Ordered app slugs that should be displayed first for this category.
  repeated string top_app_slugs_override = 2 [(buf.validate.field).repeated.max_items = 3];
}

// Response after updating a game subcategory's top apps override.
message UpdateGameCategoryTopAppsOverrideResponse {
  // The updated category.
  GameCategory category = 1;
}
