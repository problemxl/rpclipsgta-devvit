syntax = "proto3";

package devvit.dev_portal.promotional_assets;

import "devvit/dev_portal/reddit/redditor.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/promotionalassets";

// PromotionalAssetsInfo contains an app's promotional asset information.
// The fields here should be kept in sync with the AssetChangeRequestRejectedField enum values in asset_review.proto
message PromotionalAssetsInfo {
  // The ID of the app. This is a UUID, eg: "18dfa123-e89b-12d3-a456-426614174000".
  string app_id = 1;
  // The game icon asset.
  PromotionalAssetsMedia game_icon_asset = 2;
  // The featuring asset.
  PromotionalAssetsMedia featuring_asset = 3;
  // The fallback asset (optional).
  optional PromotionalAssetsMedia fallback_asset = 4;
  // The tile image asset.
  PromotionalAssetsMedia tile_image_asset = 5;
  // Short marketing copy shown with the featuring card, eg: "Make tough choices, and be judged".
  string featuring_description = 6;
  // One-liner shown next to the game icon in list surfaces, eg: "Make tough choices".
  string tile_tagline = 7;
  // AppCategory IDs associated with the game, using IDs returned by App.GetAllCategories. For example: [1, 12].
  repeated int32 game_category_ids = 8;
  // The ID of the subreddit where users are sent to play the game. This is a t5_ subreddit, eg: "t5_bo6ta".
  string game_subreddit_id = 9;
  // The subreddit name for display in the in-app catalog editor, without the r/ prefix, eg: "cat".
  optional string game_subreddit_name = 10;
  // Any flairs associated with the game, eg: ["Daily Challenge", "Featured"]
  repeated string flairs = 11;
  // The order in which posts retrieved for the game are sorted. Defaults to "HOT".
  PostsSortOrder sort_by = 12;
}

// PostsSortOrder indicates how posts retrieved for an app should be sorted, if the app is featured in the Games Tab.
enum PostsSortOrder {
  POSTS_SORT_ORDER_UNSPECIFIED = 0;
  POSTS_SORT_ORDER_BEST = 1;
  POSTS_SORT_ORDER_HOT = 2;
  POSTS_SORT_ORDER_NEW = 3;
  POSTS_SORT_ORDER_TOP = 4;
  POSTS_SORT_ORDER_RISING = 5;
}

// AssetChangeRequest contains a request to change an app's promotional assets.
message AssetChangeRequest {
  // The ID of the asset change request. This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  string id = 1;
  // The status of the asset change request, eg "UNSUBMITTED".
  AssetChangeRequestStatus status = 2;
  // The promotional assets associated with this request.
  PromotionalAssetsInfo promotional_assets = 3;
  // When the asset change request was created.
  google.protobuf.Timestamp created_at = 4;
  // When the asset change request was last updated.
  google.protobuf.Timestamp updated_at = 5;
  // The user who submitted the asset change request.
  devvit.dev_portal.reddit.Redditor submitted_by = 6;
}

// AssetChangeRequestStatus indicates the status of a request to change the app's promotional assets.
enum AssetChangeRequestStatus {
  UNSPECIFIED = 0;
  APPROVED = 1;
  DENIED = 2;
  OBSOLETE = 3;
  PENDING = 4;
  UNSUBMITTED = 5;
}

// PromotionalAssetsMedia contains a media asset associated with the app's promotional assets.
message PromotionalAssetsMedia {
  // The ID of the asset. This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  string asset_id = 1;
  // The MIME type of the asset, eg: "image/png".
  string mime_type = 2;
  // URL pointing to the asset.
  // This is optional because the asset may not be uploaded yet.
  optional string url = 3;
  // Original filename of the asset, if available. Used for display in the in-app catalog editor. Eg: "game_icon.png"
  optional string name = 4;
}

// GetDisplayRequest is a request to get the app's promotional assets for display in Developer Settings.
message GetDisplayRequest {
  // The app ID to get the promotional assets for. This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  string app_id = 1;
}

// GetDisplayResponse contains the app's promotional assets for display in Developer Settings.
message GetDisplayResponse {
  // The asset change request to display in Developer Settings.
  // If there are no promotional assets for this app, returns empty.
  optional AssetChangeRequest asset_change_request = 1;
}

// SaveChangesRequestFlairs contains optional post flair filters for a save request.
message SaveChangesRequestFlairs {
  // Any flairs associated with the game, eg: ["Daily Challenge", "Featured"]. Maximum 5, each 25 characters or fewer.
  repeated string names = 1;
}

// SaveChangesRequest is a request to save changes to the app's promotional assets.
message SaveChangesRequest {
  // The ID of the app. This is a UUID, eg: "18dfa123-e89b-12d3-a456-426614174000".
  string app_id = 1;
  // The ID of the game icon asset. This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  string game_icon_asset_id = 2;
  // The ID of the featuring asset. This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  string featuring_asset_id = 3;
  // The ID of the fallback asset (optional). This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  optional string fallback_asset_id = 4;
  // AppCategory IDs associated with the game, using IDs returned by App.GetAllCategories; for example [1, 12].
  repeated int32 game_category_ids = 5;
  // The ID of the tile image asset. This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  string tile_image_asset_id = 6;
  // Short marketing copy shown with the featuring card, for example "Make tough choices, and be judged". Maximum 35 characters.
  string featuring_description = 7;
  // One-line teaser shown next to the game icon in list surfaces, for example "Tough choices". Maximum 20 characters.
  string tile_tagline = 8;
  // The ID of the subreddit where users are sent to play the game. This is a t5_ subreddit, eg: "t5_bo6ta".
  string game_subreddit_id = 9;
  // Any flairs associated with the game, eg: ["Daily Challenge", "Featured"]. Defaults to no flair filters.
  optional SaveChangesRequestFlairs flairs = 10;
  // The order in which posts retrieved for the game are sorted. Defaults to "HOT".
  optional PostsSortOrder sort_by = 11;
}

// SaveChangesResponse contains the asset change request for the saved promotional assets.
message SaveChangesResponse {
  // The asset change request containing the saved promotional assets.
  AssetChangeRequest asset_change_request = 1;
}

// SubmitForReviewRequest is a request to submit a saved asset change request for review.
message SubmitForReviewRequest {
  // The ID of the app. This is a UUID, eg: "18dfa123-e89b-12d3-a456-426614174000".
  string app_id = 1;
  // The ID of the UNSUBMITTED asset change request to submit. This is a UUID, eg: "123e4567-e89b-12d3-a456-426614174000".
  string asset_change_request_id = 2;
}

// SubmitForReviewResponse contains the asset change request for the submitted promotional assets.
message SubmitForReviewResponse {
  // The asset change request containing the submitted promotional assets.
  AssetChangeRequest asset_change_request = 1;
}

// ClearAllRequest is a request to clear all promotional assets for an app.
message ClearAllRequest {
  // The ID of the app. This is a UUID, eg: "18dfa123-e89b-12d3-a456-426614174000".
  string app_id = 1;
}

// ClearAllResponse is returned after clearing all promotional assets for an app.
message ClearAllResponse {}
