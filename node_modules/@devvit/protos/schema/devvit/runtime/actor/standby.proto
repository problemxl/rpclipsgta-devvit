syntax = "proto3";

package devvit.runtime.actor;

import "google/protobuf/empty.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/runtime/actor";
option java_package = "com.reddit.devvit.runtime.actor";

// StandbyPod controls an Elysium bootstrap process before it has loaded an app.
service StandbyPod {
  // Loads the app identified by the request metadata and starts serving it.
  rpc LoadApp(google.protobuf.Empty) returns (google.protobuf.Empty);
}
