syntax = "proto3";

package devvit.ui.effects.web_view.v1alpha;

import "reddit/devvit/surface/v1/surface.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/ui/effects/web_view/v1alpha";
option java_package = "com.reddit.devvit.ui.effects.web_view.v1alpha";

// ShowWebViewIntent identifies which app entrypoint should be hydrated into a
// DevvitSurface.
message ShowWebViewIntent {
  // The devvit.json post.entrypoints key, eg: "leaderboard".
  string entrypoint_name = 1;
}

// ShowWebViewEffect carries either a runtime-to-gateway hydration intent or the
// hydrated DevvitSurface sent from gateway to clients.
message ShowWebViewEffect {
  enum Presentation {
    // No presentation was specified. Webbit endpoints should set a concrete
    // value when creating the effect.
    PRESENTATION_UNSPECIFIED = 0;
    // Show the web view content fullscreen. Use this when the endpoint wants
    // the web view to occupy the full screen.
    FULLSCREEN = 1;
    // Show the web view as an overlay/modal that respects
    // DevvitSurface.styles.heightPixels. Use this when the endpoint wants modal
    // presentation, for example with styles.heightPixels = 320.
    MODAL = 2;
  }

  oneof payload {
    // Intended to be populated by the app. This allows gateway-execute to know
    // which DevvitSurface entrypoint should be hydrated.
    ShowWebViewIntent intent = 1;
    // Intended to be populated by gateway-execute after hydration from
    // gateway-graphql to provide surface details to the client.
    reddit.devvit.surface.v1.DevvitSurface surface = 2;
  }
  // How the selected entrypoint web view should be presented. The Webbit
  // endpoint sets this when creating the effect.
  Presentation presentation = 3;
}
